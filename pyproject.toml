[project]
name = "platinum-voice"
version = "1.0.0"
description = "Unlimited Burmese TTS App"
requires-python = ">=3.9"
dependencies = [
    "flet",
    "flet-audio",
    "edge-tts",
]

[tool.flet]
org = "com.platinumvoice"
product = "Platinum Voice"
company = "Platinum Voice"
copyright = "Copyright (c) 2025"
# App Icon ကို ဒီနေရာမှာ သတ်မှတ်ထားပါတယ်
icon = "logo.png" 

[tool.flet.app]
path = "."
assets_dir = "assets"

[tool.flet.android]
target_arch = ["arm64-v8a"] 

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
