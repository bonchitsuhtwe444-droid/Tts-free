name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # flet-cli ကို သီးသန့် install လုပ်ပါ
      - name: Install Flet CLI
        run: pip install flet-cli

      # flet build command ကို တိုက်ရိုက် run ပါ
      - name: Build APK
        run: flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: platinum-voice-apk
          path: build/apk/*.apk
