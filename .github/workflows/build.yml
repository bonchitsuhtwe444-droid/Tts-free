name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flet ရဲ့ တရားဝင် Build Action ကို သုံးခြင်း
      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk

      # ထွက်လာတဲ့ APK ဖိုင်ကို Download ရယူရန် တင်ခြင်း
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: platinum-voice-apk
          path: ${{ steps.build.outputs.archive-path }}
