name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Flet ကို အရင် install လုပ်ပေးရပါမယ်
      - name: Install Flet
        run: pip install flet[build]

      # ပြီးမှ တရားဝင် Action ကို သုံးပါမယ်
      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: platinum-voice-apk
          path: ${{ steps.build.outputs.archive-path }}
